<!-- Custom Glassmorphism Dark Theme for Storybook UI Shell -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* Root & Global Styling */
  :root {
    --accent-emerald: #34d399;
    --accent-sky: #38bdf8;
    --accent-violet: #a78bfa;
    --bg-dark-base: #020617;
    --border-glass: rgba(255, 255, 255, 0.08);
  }

  body, button, input, textarea, select {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    color: #f8fafc !important;
  }

  /* Sidebar header & Brand Logo */
  .sidebar-header {
    padding: 16px 18px !important;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(2, 6, 23, 0.8) 100%) !important;
    border-bottom: 1px solid var(--border-glass) !important;
  }

  .sidebar-header a, .sidebar-header div, [title*="UEDP"], [title*="Sales"] {
    font-family: 'Outfit', sans-serif !important;
    font-weight: 800 !important;
    font-size: 16px !important;
    background: linear-gradient(135deg, #38bdf8 0%, #34d399 50%, #a78bfa 100%) !important;
    -webkit-background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
    letter-spacing: -0.02em !important;
  }

  /* Sidebar Container with Glassmorphism */
  .sidebar-container {
    background: radial-gradient(circle at 0% 0%, #0f172a 0%, #020617 100%) !important;
    border-right: 1px solid var(--border-glass) !important;
  }

  /* Tree items (folders, components, stories) */
  [data-nodetype="group"] {
    font-family: 'Outfit', sans-serif !important;
    font-weight: 700 !important;
    font-size: 11px !important;
    text-transform: uppercase !important;
    letter-spacing: 0.1em !important;
    color: #64748b !important;
    margin-top: 14px !important;
    padding-left: 10px !important;
  }

  [data-nodetype="component"], [data-nodetype="story"], .sidebar-item {
    font-size: 13.5px !important;
    border-radius: 8px !important;
    margin: 3px 8px !important;
    padding: 6px 10px !important;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
    color: #94a3b8 !important;
    border: 1px solid transparent !important;
  }

  [data-nodetype="component"]:hover, [data-nodetype="story"]:hover {
    background: rgba(30, 41, 59, 0.6) !important;
    color: #f8fafc !important;
    transform: translateX(3px) !important;
    border-color: rgba(255, 255, 255, 0.06) !important;
  }

  [data-selected="true"] {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(52, 211, 153, 0.14)) !important;
    color: #38bdf8 !important;
    font-weight: 600 !important;
    border: 1px solid rgba(56, 189, 248, 0.4) !important;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.15) !important;
    backdrop-filter: blur(8px) !important;
    transform: translateX(3px) !important;
  }

  /* Search input */
  .search-field input, input[placeholder*="Search"] {
    background: rgba(15, 23, 42, 0.8) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    border-radius: 10px !important;
    color: #f8fafc !important;
    backdrop-filter: blur(10px) !important;
    padding: 8px 12px !important;
    transition: all 0.2s ease !important;
  }

  .search-field input:focus, input[placeholder*="Search"]:focus {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.25) !important;
    outline: none !important;
  }

  /* Top Toolbar Header */
  header, [role="toolbar"] {
    background: rgba(7, 11, 20, 0.85) !important;
    border-bottom: 1px solid var(--border-glass) !important;
    backdrop-filter: blur(12px) !important;
  }

  [role="toolbar"] button {
    border-radius: 8px !important;
    transition: all 0.15s ease !important;
  }

  [role="toolbar"] button:hover {
    background: rgba(30, 41, 59, 0.7) !important;
    color: #38bdf8 !important;
  }

  /* Scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #020617;
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #38bdf8 0%, #34d399 100%);
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #38bdf8;
  }
</style>
