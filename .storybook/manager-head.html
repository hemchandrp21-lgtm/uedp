<!-- Custom Head Injections for Storybook Manager UI (sasystem Rebrand & Microinteractions) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  /* Change Sidebar Brand Header Style */
  .sidebar-header {
    padding: 16px !important;
  }

  .sidebar-header img, 
  .sidebar-header svg.sidebar-brand-symbol {
    display: none !important;
  }

  /* Custom sasystem Brand Header Container */
  .sasystem-sb-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none !important;
    user-select: none;
    cursor: pointer;
    position: relative;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    outline: none;
  }

  .sasystem-sb-brand:hover {
    background: rgba(30, 41, 59, 0.8);
    border-color: rgba(99, 102, 241, 0.4);
    box-shadow: 0 8px 24px -6px rgba(99, 102, 241, 0.25);
  }

  .sasystem-sb-brand:active {
    transform: scale(0.95);
  }

  /* Logo Icon Aura Glow */
  .sasystem-sb-aura {
    position: absolute;
    top: 50%;
    left: 24px;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%) scale(0.6);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.6) 0%, rgba(99, 102, 241, 0.4) 60%, transparent 100%);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    filter: blur(6px);
    pointer-events: none;
  }

  .sasystem-sb-brand:hover .sasystem-sb-aura {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.4);
  }

  /* Logo Icon SVG & Microinteractions */
  .sasystem-sb-logo-svg {
    width: 34px;
    height: 34px;
    z-index: 1;
    perspective: 500px;
    transform-style: preserve-3d;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
  }

  .sasystem-sb-brand:hover .sasystem-sb-logo-svg {
    transform: perspective(500px) rotateY(14deg) rotateX(-6deg) translateY(-2px) scale(1.08);
    filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.4));
  }

  /* Typography & Text Microinteractions */
  .sasystem-sb-text-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }

  .sasystem-sb-title {
    font-family: 'Outfit', 'Inter', system-ui, sans-serif;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), letter-spacing 0.3s ease;
  }

  .sasystem-sb-prefix {
    background: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    transition: background-position 0.5s ease;
  }

  .sasystem-sb-suffix {
    color: #f8fafc;
    font-weight: 600;
    transition: color 0.3s ease;
  }

  .sasystem-sb-brand:hover .sasystem-sb-title {
    transform: translateY(-1.5px);
    letter-spacing: 0.01em;
  }

  .sasystem-sb-brand:hover .sasystem-sb-prefix {
    background-position: 100% 0%;
  }

  .sasystem-sb-brand:hover .sasystem-sb-suffix {
    color: #38bdf8;
  }

  .sasystem-sb-tagline {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #94a3b8;
    margin-top: 2px;
    transition: color 0.3s ease, letter-spacing 0.3s ease;
  }

  .sasystem-sb-brand:hover .sasystem-sb-tagline {
    color: #cbd5e1;
    letter-spacing: 0.18em;
  }

  /* Dynamic Underline Microinteraction */
  .sasystem-sb-underline {
    position: absolute;
    bottom: -3px;
    left: 0;
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg, #06b6d4, #6366f1, #ec4899);
    border-radius: 2px;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    opacity: 0;
  }

  .sasystem-sb-brand:hover .sasystem-sb-underline {
    transform: scaleX(1);
    opacity: 1;
  }

  /* Pulse Animation for Node Dot */
  @keyframes sb-node-pulse {
    0%, 100% { r: 3px; opacity: 0.8; }
    50% { r: 4.5px; opacity: 1; }
  }

  .sasystem-sb-node {
    animation: sb-node-pulse 2.5s infinite ease-in-out;
  }
</style>

<script>
  // DOM Observer to customize Storybook Brand Header with sasystem Logo & Microinteractions
  document.addEventListener('DOMContentLoaded', () => {
    document.title = 'sasystem - Sales Design';

    function injectSasystemBrand() {
      const brandLinks = document.querySelectorAll('a.sidebar-brand, a[title="sasystem"], .sidebar-header a');
      brandLinks.forEach(brand => {
        if (brand.getAttribute('data-sasystem-injected') === 'true') return;
        
        brand.setAttribute('data-sasystem-injected', 'true');
        brand.className = 'sasystem-sb-brand';
        brand.innerHTML = `
          <div class="sasystem-sb-aura"></div>
          <svg className="sasystem-sb-logo-svg" class="sasystem-sb-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="sb-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0f172a" />
                <stop offset="100%" stop-color="#1e293b" />
              </linearGradient>
              <linearGradient id="sb-sa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#06b6d4" />
                <stop offset="50%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#ec4899" />
              </linearGradient>
              <linearGradient id="sb-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#818cf8" />
              </linearGradient>
              <filter id="sb-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>
            <path d="M24 4L41.3205 14V34L24 44L6.67949 34V14L24 4Z" fill="url(#sb-bg-grad)" stroke="url(#sb-accent-grad)" stroke-width="1.5" stroke-linejoin="round" />
            <path d="M15 17C15 14.7909 17.5 13 21 13H27C30.5 13 33 14.7909 33 17C33 19.5 30 21 27 22L21 24C18 25 15 26.5 15 29C15 31.2091 17.5 33 21 33H27C30.5 33 33 31.2091 33 29" stroke="url(#sb-sa-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#sb-glow)" />
            <path d="M19 28H29" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
            <circle class="sasystem-sb-node" cx="33" cy="17" r="3" fill="#06b6d4" />
            <circle class="sasystem-sb-node" cx="15" cy="29" r="3" fill="#ec4899" />
          </svg>
          <div class="sasystem-sb-text-box">
            <div class="sasystem-sb-title">
              <span class="sasystem-sb-prefix">sa</span>
              <span class="sasystem-sb-suffix">system</span>
            </div>
            <span class="sasystem-sb-tagline">sales design</span>
            <div class="sasystem-sb-underline"></div>
          </div>
        `;
      });
    }

    const observer = new MutationObserver(() => {
      injectSasystemBrand();
    });

    observer.observe(document.body, { childList: true, subtree: true });
    injectSasystemBrand();
  });
</script>

<script>
  // Global Loud & Warm Acoustic Grand Piano Engine for Storybook Manager UI
  (function() {
    let audioCtx = null;
    let lastPlay = 0;
    let pianoIdx = 0;
    // Warm acoustic grand piano scale (Middle C4 to C5)
    const scale = [261.63, 329.63, 392.00, 523.25, 659.25, 523.25, 392.00, 329.63];

    function getAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playPianoClick() {
      const now = performance.now();
      if (now - lastPlay < 15) return;
      lastPlay = now;

      const ctx = getAudioContext();
      if (!ctx) return;

      const startTime = ctx.currentTime;
      const freq = scale[pianoIdx];
      pianoIdx = (pianoIdx + 1) % scale.length;
      const duration = 0.55;

      const masterGain = ctx.createGain();
      masterGain.connect(ctx.destination);
      masterGain.gain.setValueAtTime(0.0001, startTime);
      masterGain.gain.linearRampToValueAtTime(0.85, startTime + 0.004); // High volume boost
      masterGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      // 1. Fundamental Tone (Sine)
      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(freq, startTime);
      const g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.9, startTime);
      osc1.connect(g1);
      g1.connect(masterGain);
      osc1.start(startTime);
      osc1.stop(startTime + duration);

      // 2. Sub-Octave Wooden Body Resonance (0.5x frequency)
      const oscSub = ctx.createOscillator();
      oscSub.type = 'sine';
      oscSub.frequency.setValueAtTime(freq * 0.5, startTime);
      const gSub = ctx.createGain();
      gSub.gain.setValueAtTime(0.4, startTime);
      gSub.gain.exponentialRampToValueAtTime(0.0001, startTime + (duration * 0.6));
      oscSub.connect(gSub);
      gSub.connect(masterGain);
      oscSub.start(startTime);
      oscSub.stop(startTime + duration);

      // 3. Second Harmonic (Triangle 2x)
      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(freq * 2.001, startTime);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.45, startTime);
      g2.gain.exponentialRampToValueAtTime(0.0001, startTime + (duration * 0.5));
      osc2.connect(g2);
      g2.connect(masterGain);
      osc2.start(startTime);
      osc2.stop(startTime + duration);

      // 4. Third Harmonic Sparkle (Sine 3x)
      const osc3 = ctx.createOscillator();
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(freq * 3.002, startTime);
      const g3 = ctx.createGain();
      g3.gain.setValueAtTime(0.2, startTime);
      g3.gain.exponentialRampToValueAtTime(0.0001, startTime + (duration * 0.3));
      osc3.connect(g3);
      g3.connect(masterGain);
      osc3.start(startTime);
      osc3.stop(startTime + duration);
    }

    window.addEventListener('pointerdown', function() {
      playPianoClick();
    }, { capture: true, passive: true });
  })();
</script>
