<!-- Google Analytics 4 (GA4) Tracking Snippet -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MEASUREMENT_ID"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-MEASUREMENT_ID', {
    page_title: 'Storybook Design System Showcase',
    page_path: window.location.hash || window.location.pathname
  });

  // Track story route navigation
  function trackStoryNavigation() {
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_title: document.title || 'Storybook Component',
        page_path: window.location.hash || window.location.pathname
      });
    }
  }

  window.addEventListener('hashchange', trackStoryNavigation);
  window.addEventListener('popstate', trackStoryNavigation);
</script>
